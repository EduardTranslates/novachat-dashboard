name: CI — Data Integrity & Next.js Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild compiled data and run integrity & Python LQA tests
        run: |
          python scripts/build_data.py
          python scripts/test_integrity.py
          python raw-data/lqa-checker/test_lqa_checks.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint and production build
        run: |
          npm run lint
          npm run build
